<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — DigiPasar</title>
<link rel="stylesheet" href="/css/digipasar.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-page="login" class="min-h-screen flex flex-col">

<!-- ===== NAVBAR ===== -->
<header class="site-header">
  <div class="max-w-7xl mx-auto px-4"><div id="hdRoot"></div></div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="card card-pad" style="padding:2rem">
      <div class="text-center mb-6">
        <div class="avatar mx-auto mb-4" style="width:3.5rem;height:3.5rem;font-size:1.6rem">⚡</div>
        <h1 class="font-extrabold" style="font-size:1.6rem">Selamat Datang Kembali</h1>
        <p class="tiny muted mt-1">Masuk untuk melanjutkan belanja produk digital.</p>
      </div>

      <form id="authForm" class="space-y-4">
        <div>
          <label class="field-label" for="email">Email</label>
          <input id="email" type="email" required placeholder="nama@email.com" autocomplete="email">
        </div>
        <div>
          <label class="field-label" for="password">Password</label>
          <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <div id="turnstile" class="flex justify-center pt-1"></div>

        <button id="submitBtn" type="submit" class="btn btn-primary btn-lg btn-block">Masuk</button>
      </form>

      <div id="googleWrap">
        <div class="flex items-center gap-3 my-5">
          <div class="divider-x"></div>
          <span class="tiny muted">atau</span>
          <div class="divider-x"></div>
        </div>
        <div id="googleBtn" class="flex justify-center"></div>
      </div>

      <p class="text-center tiny muted mt-6">
        Belum punya akun? <a href="/register.html" class="link">Daftar gratis</a>
      </p>
    </div>
    <p class="text-center tiny muted mt-4">Dilindungi Cloudflare Turnstile • Login Google instan</p>
  </div>
</main>

<footer class="footer-mini">© 2026 DigiPasar — Marketplace Produk Digital Indonesia.</footer>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/fx.js"></script>
<script src="/js/pages/auth.js"></script>
</body>
</html>
